apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dynamo
resources:
  - ../../base
images:
  - name: 477374169746.dkr.ecr.us-east-2.amazonaws.com/test-dynamo-repository
    newTag: latest
patches:
  - target:
      kind: Deployment
      name: dynamo-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: test
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: test
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: us-east-2

